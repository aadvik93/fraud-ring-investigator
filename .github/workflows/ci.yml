name: CI

on:
  push:
    branches: [main, improve-demo-reliability, judge-ready-workbench]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      falkordb:
        image: falkordb/falkordb:latest
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - name: Validate frontend JavaScript syntax
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          html = Path("static/index.html").read_text()
          scripts = re.findall(r"<script>(.*?)</script>", html, re.DOTALL)
          assert scripts, "No inline JavaScript found in static/index.html"
          Path("/tmp/fraud-ring-ui.js").write_text("\n".join(scripts))
          PY
          node --check /tmp/fraud-ring-ui.js
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Seed reproducible demo graph
        run: python seed.py
      - name: Run tests
        run: python -m pytest -q
